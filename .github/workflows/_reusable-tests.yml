name: Reusable - Tests

on:
  workflow_call:
    inputs:
      upload-report:
        description: "Whether to upload test report as artifact"
        required: false
        default: false
        type: boolean
    outputs:
      report-artifact:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.test.outputs.artifact-name }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auctions_test
          POSTGRES_USER: auctions
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run migrations
        env:
          DATABASE_URL: postgres://auctions:testpassword@localhost:5432/auctions_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://auctions:testpassword@localhost:5432/auctions_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          mkdir -p reports
          pytest --tb=short

      - name: Upload test report
        id: upload
        if: inputs.upload-report && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload coverage to summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for full HTML report." >> $GITHUB_STEP_SUMMARY

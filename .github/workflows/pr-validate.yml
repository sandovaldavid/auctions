name: PR Validate

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ci / lint
    uses: ./.github/workflows/_reusable-lint.yml

  tests:
    name: ci / tests
    uses: ./.github/workflows/_reusable-tests.yml
    needs: lint
    with:
      upload-report: true

  security:
    name: security / scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install security tools
        run: pip install safety bandit

      - name: Safety dependency scan
        run: safety check -r requirements.txt --output text
        continue-on-error: true

      - name: Bandit code scan
        run: bandit -r auctions/ -ll -x auctions/migrations/ --format github

  publish-report:
    name: Publish test report to gh-pages
    needs: tests
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: downloaded-report/

      - name: Copy report to PR directory
        run: |
          mkdir -p reports/pr/${{ github.event.pull_request.number }}
          cp -r downloaded-report/* reports/pr/${{ github.event.pull_request.number }}/

      - name: Commit report to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/pr/${{ github.event.pull_request.number }}/
          git diff --staged --quiet || git commit -m "ci: add test report for PR #${{ github.event.pull_request.number }}"
          git push

name: Release Please

on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'develop' && 'release-please-config-prerelease.json' || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.ref_name == 'develop' && '0.1.1-beta.0' || '' }}

  post-release:
    name: Post-release tasks
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log release created
        run: echo "Released ${{ needs.release-please.outputs.tag-name }}"

name: Build & Publish DevContainer

on:
  push:
    branches: [main, develop]
    paths:
      - ".devcontainer/**"
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build DevContainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name
        id: branch
        run: echo "name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Build and push DevContainer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-devcontainer:latest
            ghcr.io/${{ github.repository }}-devcontainer:${{ steps.branch.outputs.name }}
            ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

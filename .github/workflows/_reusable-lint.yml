name: Reusable - Lint & Type Check

on:
  workflow_call:
    outputs:
      result:
        description: "Lint result"
        value: ${{ jobs.lint.outputs.result }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.summary.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black mypy django-stubs bandit

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Black format check
        run: black --check .

      - name: MyPy type check
        run: mypy auctions/
        continue-on-error: true

      - name: Bandit security lint
        run: bandit -r auctions/ -ll -x auctions/migrations/

      - name: Summary
        id: summary
        if: always()
        run: echo "result=success" >> $GITHUB_OUTPUT

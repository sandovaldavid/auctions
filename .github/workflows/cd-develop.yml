name: CD - Develop (Staging)

# Disabled until Oracle VM is configured with k3s + Argo CD.
# Re-enable by adding: push: { branches: [develop] }
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual deploy to staging'

concurrency:
  group: cd-develop
  cancel-in-progress: true

jobs:
  lint:
    name: ci / lint
    uses: ./.github/workflows/_reusable-lint.yml

  tests:
    name: ci / tests
    uses: ./.github/workflows/_reusable-tests.yml
    needs: lint
    with:
      upload-report: true

  build-and-push:
    name: Build & Push Docker image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:develop
            ghcr.io/${{ github.repository }}:develop-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-report:
    name: Update develop report on gh-pages
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: downloaded-report/

      - name: Update develop report
        run: |
          mkdir -p reports/develop
          cp -r downloaded-report/* reports/develop/

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/develop/
          git diff --staged --quiet || git commit -m "ci: update develop test report (${{ github.sha }})"
          git push

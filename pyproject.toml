[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    ".venv",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
]
ignore = ["E501", "B008", "N999"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["ALL"]
"commerce/settings.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py310"]
exclude = '''
/(
    migrations
  | staticfiles
  | \.git
  | \.venv
)/
'''

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = [
    "migrations/",
    "staticfiles/",
]

[tool.django-stubs]
django_settings_module = "commerce.settings"

[tool.bandit]
exclude_dirs = ["tests", "migrations", "staticfiles"]
skips = ["B101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "commerce.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=auctions",
    "--cov-report=html:reports/coverage",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "--html=reports/test-report.html",
    "--self-contained-html",
    "-v",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["auctions"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/settings*",
    "manage.py",
    "auctions/admin_config.py",
    "auctions/management/commands/generate_reports.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

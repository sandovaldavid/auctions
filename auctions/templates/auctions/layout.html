{% load static %}

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
		<meta
			name="description"
			content="Auction Site - Find and bid on amazing items online" />
		<meta name="theme-color" content="#3498db" />

		<title>{% block title %}Auctions{% endblock %}</title>

		<!-- Preconnect to external domains for performance -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
		<link rel="dns-prefetch" href="//fonts.googleapis.com" />

		<!-- Critical CSS - Load immediately -->
		<link href="{% static 'css/variables.css' %}" rel="stylesheet" />
		<link href="{% static 'css/layout.css' %}" rel="stylesheet" />
		<link href="{% static 'css/auctions/styles.css' %}" rel="stylesheet" />

		<!-- Bootstrap CSS - Load with high priority -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet" />

		<!-- Font Awesome - Load asynchronously -->
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
			rel="stylesheet"
			media="print"
			onload="this.media='all'" />

		<!-- Components CSS - Load asynchronously -->
		<link
			href="{% static 'css/components.css' %}"
			rel="stylesheet"
			media="print"
			onload="this.media='all'" />
		<link
			href="{% static 'css/components/navigation.css' %}"
			rel="stylesheet"
			media="print"
			onload="this.media='all'" />

		<!-- Extra CSS block for additional styles -->
		{% block extra_css %}{% endblock %}

		<!-- Favicon -->
		<link rel="icon" href="{% static '/favicon.ico' %}" type="image/x-icon" />

		<!-- Fallback for async CSS loading -->
		<noscript>
			<link href="{% static 'css/components.css' %}" rel="stylesheet" />
			<link
				href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
				rel="stylesheet" />
		</noscript>
	</head>
	<body>
		<!-- Navigation Component -->
		{% include "auctions/components/navigation.html" %}

		<!-- Main Content -->
		<main id="main-content" >
			{% block body %}{% endblock %}
		</main>

		<!-- Back to Top Button -->
		<button id="back-to-top" class="back-to-top" aria-label="Back to top">
			<i class="fas fa-arrow-up" aria-hidden="true"></i>
		</button>

		<!-- Footer -->
		{% include "auctions/components/footer.html" %}

		<!-- Scripts -->
		<!-- Bootstrap JS - Load with high priority -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			defer></script>

		<!-- Layout JavaScript - Load immediately for onclick handlers -->
		<script src="{% static 'js/layout.js' %}"></script>

		<!-- Extra JS block for additional scripts -->
		{% block extra_js %}{% endblock %}
	</body>
</html>
